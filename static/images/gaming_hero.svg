<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="800" height="600" fill="#080c16" rx="24"/>
  
  <!-- Glowing rings -->
  <circle cx="400" cy="300" r="220" stroke="url(#purpleGrad)" stroke-width="2" fill="none" opacity="0.3"/>
  <circle cx="400" cy="300" r="160" stroke="url(#cyberGrad)" stroke-width="3" fill="none" opacity="0.4" stroke-dasharray="10 15"/>
  <circle cx="400" cy="300" r="100" stroke="#00f2fe" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Center Gamepad Console -->
  <g transform="translate(250, 190)" filter="url(#glow)">
    <!-- Controller Body -->
    <path d="M 50 150 C 30 150 10 200 30 260 C 45 305 90 280 120 230 L 180 230 C 210 280 255 305 270 260 C 290 200 270 150 250 150 C 220 150 190 170 150 170 C 110 170 80 150 50 150 Z" 
          fill="url(#purpleGrad)" opacity="0.9"/>
    
    <!-- D-Pad -->
    <rect x="70" y="195" width="30" height="10" rx="3" fill="#ffffff"/>
    <rect x="80" y="185" width="10" height="30" rx="3" fill="#ffffff"/>

    <!-- Action Buttons -->
    <circle cx="215" cy="190" r="7" fill="#00f2fe"/>
    <circle cx="230" cy="205" r="7" fill="#ff0080"/>
    <circle cx="200" cy="205" r="7" fill="#fbbf24"/>
    <circle cx="215" cy="220" r="7" fill="#10b981"/>

    <!-- Center screen with code symbol -->
    <rect x="125" y="185" width="50" height="30" rx="6" fill="#0b0f19" stroke="#00f2fe" stroke-width="2"/>
    <text x="150" y="206" fill="#00f2fe" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Floating Coding Elements -->
  <g transform="translate(100, 100)">
    <rect width="160" height="60" rx="12" fill="#121826" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="20" y="36" fill="#a5d6ff" font-family="monospace" font-size="14">def play():</text>
    <text x="40" y="52" fill="#6ee7b7" font-family="monospace" font-size="12">return "WIN"</text>
  </g>

  <g transform="translate(560, 110)">
    <rect width="150" height="55" rx="12" fill="#121826" stroke="#c084fc" stroke-width="1.5"/>
    <text x="20" y="34" fill="#f0abfc" font-family="monospace" font-size="14">XP += 100</text>
  </g>

  <g transform="translate(540, 420)">
    <rect width="180" height="65" rx="12" fill="#121826" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="20" y="32" fill="#fde68a" font-family="monospace" font-size="14">🏆 Daraja 5</text>
    <text x="20" y="52" fill="#94a3b8" font-family="sans-serif" font-size="12">Algo Master</text>
  </g>
</svg>
